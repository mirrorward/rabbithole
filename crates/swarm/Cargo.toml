[package]
name = "rabbithole-swarm"
description = "The Warren — swarm file distribution: manifests, chunk scheduling, Bao-verified multi-source transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
rabbithole-identity.workspace = true
rabbithole-net.workspace = true
rabbithole-reticulum.workspace = true
serde.workspace = true
postcard.workspace = true
blake3.workspace = true
bao-tree.workspace = true
range-collections.workspace = true
positioned-io.workspace = true
hex.workspace = true
thiserror.workspace = true
tokio.workspace = true
# A burrow as a source of proved ranges needs a session to ask over. Only
# the clients that have one (the app, the CLI) turn this on; the server
# builds the crate without it.
rabbithole-core = { workspace = true, optional = true }
rabbithole-proto = { workspace = true, optional = true }

[features]
default = []
client = ["dep:rabbithole-core", "rabbithole-core/native", "dep:rabbithole-proto"]

[dev-dependencies]
tempfile.workspace = true
