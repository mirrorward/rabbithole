[package]
name = "rabbithole-art"
description = "CP437 and ANSI/SGR parsing and rendering, SAUCE metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["png"]
# PNG thumbnail rasterizer (`render_png`). The wasm SPA only needs the ANSI
# parser and VGA palette, so it disables this and never ships `png` + flate.
png = ["dep:png"]

[dependencies]
png = { workspace = true, optional = true }
