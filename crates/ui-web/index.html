<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RabbitHole</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="RabbitHole — a cozy, modern BBS: chat, boards, DMs, files, art, and radio." />

    <!-- PWA install-readiness. The embedded server (apps/server/src/http.rs)
         generates /manifest.webmanifest only when the web root does not ship
         one, so this checked-in manifest wins. Colours are the Clean-dark
         pack tokens (crates/ui-web/src/packs.rs). -->
    <meta name="theme-color" content="#6c9cff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Trunk: compile this crate's bin to wasm + JS glue (content-hashed
         filenames) and inject the loader here. -->
    <!--
      data-wasm-opt="z": size-first Binaryen pass on release builds (debug
      skips wasm-opt). data-wasm-opt-params: the wasm32 target enables a set
      of post-MVP features by default (bulk memory, non-trapping float→int,
      sign extension, multivalue, reference types, mutable globals), and
      wasm-opt validates against the MVP unless each is named. So `trunk
      build --release` failed outright while debug builds were fine, meaning
      release SPA builds were impossible. That is exactly what packaging and
      deployment need, so the features are listed here rather than reaching
      for --enable-all, which would also switch on threads and SIMD that
      this bundle does not use.
    -->
    <link
      data-trunk
      rel="rust"
      data-bin="rabbithole-ui-web"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-multivalue --enable-reference-types --enable-mutable-globals"
    />

    <!-- Trunk: copy the PWA shell assets to the dist (= web) root. sw.js
         must sit at the top level: a service worker's default scope is its
         own directory, and ours must cover the whole app ("/"). -->
    <link data-trunk rel="copy-file" href="assets/sw.js" />
    <link data-trunk rel="copy-file" href="assets/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="assets/icon-192.png" />
    <link data-trunk rel="copy-file" href="assets/icon-512.png" />
    <!-- The app's logo, for the connect window (a 256px cut of the desktop
         icon art, apps/desktop/icons/about.png). -->
    <link data-trunk rel="copy-file" href="assets/logo.png" />
    <!-- The display face (Space Grotesk, latin, OFL: assets/space-grotesk-OFL.txt). -->
    <link data-trunk rel="copy-file" href="assets/space-grotesk-latin.woff2" />

    <!-- A bundle that will not load leaves a blank window and says nothing.
         The usual cause is a copy kept in this browser that no longer
         matches this document: the browser checks the integrity hash,
         refuses the file, and the service worker hands back the same copy
         at every reload, so it never mends on its own.

         Two signals. The loader above is a module, so a refusal arrives as
         a failed import — an error or a rejected promise — rather than as
         a resource error on a tag. And whatever the reason, an app that has
         not started after a good long wait has not started. Either way:
         clear what is stored and come back for a fresh copy, once per
         visit, rather than leaving somebody looking at nothing. -->
    <script>
      (function () {
        var started = false;
        var mending = false;
        addEventListener("TrunkApplicationStarted", function () {
          started = true;
        });
        function mend() {
          if (mending || started) return;
          try {
            /* Once. Without somewhere to remember that, a bundle that is
               genuinely gone would reload for ever, so a browser that
               refuses storage is left alone. */
            if (sessionStorage.getItem("rh-shell-reset")) return;
            sessionStorage.setItem("rh-shell-reset", "1");
          } catch (_) {
            return;
          }
          mending = true;
          var again = function () {
            location.reload();
          };
          var jobs = [];
          try {
            if (navigator.serviceWorker) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(
                    rs.map(function (r) {
                      return r.unregister();
                    }),
                  );
                }),
              );
            }
            if (window.caches) {
              jobs.push(
                caches.keys().then(function (ks) {
                  return Promise.all(
                    ks.map(function (k) {
                      return caches.delete(k);
                    }),
                  );
                }),
              );
            }
          } catch (_) {
            /* nothing to clear */
          }
          Promise.all(jobs).then(again, again);
        }
        function blames_the_bundle(text) {
          return (
            text.indexOf("integrity") !== -1 ||
            text.indexOf("rabbithole-ui-web-") !== -1 ||
            text.indexOf("Failed to fetch dynamically imported module") !== -1
          );
        }
        addEventListener("error", function (e) {
          var el = e.target;
          var url = (el && (el.src || el.href)) || "";
          if (url.indexOf("/rabbithole-ui-web-") !== -1) return mend();
          if (e.message && blames_the_bundle(String(e.message))) mend();
        }, true);
        addEventListener("unhandledrejection", function (e) {
          var why = e.reason && (e.reason.message || e.reason);
          if (why && blames_the_bundle(String(why))) mend();
        });
        /* And the catch-all: nothing on screen and nothing started, long
           after everything should have. A slow phone on a slow line is
           given far more time than it needs. */
        addEventListener("load", function () {
          setTimeout(function () {
            if (!started && !document.body.firstChild) mend();
          }, 30000);
        });
      })();
    </script>

    <style>
      /* Pre-boot backdrop: the Clean-dark background token, so the first
         paint (before the wasm mounts and injects the app stylesheet)
         does not flash white. The app overrides everything on mount. */
      /* Match the OS: a light-mode launch used to flash dark-then-light,
         which is the "web app booting" signature. The app repaints these the
         moment the real theme resolves. */
      html {
        background: #fafbfc;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #14161b;
        }
      }
    </style>
  </head>
  <body></body>
</html>
