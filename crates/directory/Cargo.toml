[package]
name = "rabbithole-directory"
version.workspace = true
edition.workspace = true
description = "Looking Glass discovery client: read rabbithole.directory, fall back to a tracker"

[dependencies]
# Signature verification stays portable; only signing and network transports
# opt into native identity and I/O dependencies.
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
hex.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
thiserror.workspace = true
rabbithole-identity = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[features]
default = []
signing = ["dep:rabbithole-identity"]
# Native transport: HTTPS to the directory and TCP to a tracker's status port.
# Off for wasm, which has neither and uses the browser's own fetch.
native = [
    "dep:tokio",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
]

[dev-dependencies]
rabbithole-identity.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
